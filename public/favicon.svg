<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 110 900 660" width="900" height="660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
